<footer class="composer">
  <div class="composer-box">
    <span class="mic-icon">◔</span>
    <textarea
      [ngModel]="message"
      (ngModelChange)="onModelChange($event)"
      (keydown)="onKeydown($event)"
      rows="1"
      [placeholder]="'Message ' + productName + '...'"
      [disabled]="loading"
    ></textarea>
    <button type="button" (click)="sendMessage.emit()" [disabled]="loading || !message.trim()">
      {{ loading ? '...' : '↑' }}
    </button>
  </div>
  <p class="composer-hint">The Layer may provide inaccurate information. Verify critical data.</p>
</footer>
